[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "Local-first MedTech and healthcare AI job discovery assistant"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.42,<2",
  "requests>=2.31,<3",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
